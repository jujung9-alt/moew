<!DOCTYPE html>
<html lang="ko">
<head>
    <title>움직이는 점수판!</title>
    <style>
        canvas {
            border: 2px solid #333;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <canvas id="myCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        const scores = [65, 92, 78, 84, 50, 95, 80];
        
        // 처음 시작할 Y축 위치 (화면 위쪽 밖에서 출발)
        let startY = 0;

        // 화면을 계속 그려주는 함수(동작) 만들기
        function draw() {
            // 1. 도화지 전체를 깨끗하게 지우기 (지우개)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.font = "18px sans-serif";
            let yPosition = startY;

            // 2. 글자들 그려주기
            for (let score of scores) {
                if (score >= 80) {
                    ctx.fillStyle = "green";
                    ctx.fillText(score + "점: 합격입니다!", 20, yPosition);
                } else {
                    ctx.fillStyle = "red";
                    ctx.fillText(score + "점: 불합격입니다!", 20, yPosition);
                }
                yPosition += 30; // 글자 간격
            }

            // 3. Y 위치를 1씩 늘려서 조금씩 아래로 이동하게 만들기
            startY += 1;

            // 4. 화면이 끝까지 내려가지 않았다면 다음 장면 계속 그리기
            if (startY < 200) {
                requestAnimationFrame(draw);
            }
        }

        // 애니메이션 시작!
        draw();
    </script>
</body>
</html>
