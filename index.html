<!DOCTYPE hmtl>
<html lang = 'ko'>
<head>
    <title>이것은 타이틀을 곁들인 타이틀인!</title>
</head>
    
<body>
    <canvas id = 'tan'></canvas>
    
    <script>
        const tab = document.getElementById('tan');
        tab.width = window.innerWidth;
        tab.height = window.innerHeight
        
        const a = prompt('동의 하십니까?(예/아니오)')

        if (a === '예') {
            const b = confirm('정말 동의하십니까?')

            if (b === true) {
                const ctx = tan.getContext('2d');

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.font = ('500px Arial');
                ctx.fillStyle = 'skyblue';
                
                ctx.fillText('메롱' , tab.width / 2 , tab.height / 2);
            }
        }
    </script>
</body>
</html>
