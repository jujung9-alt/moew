<!DOCTYPE html>
<html lang="ko">
<head>
    <title>이것은 타이틀이란것이다</title>
    <script>
        const scores = [65, 92, 78, 84, 50, 95, 80];

        // scores 배열에서 점수(score)를 하나씩 꺼내서 반복
        for (let score of scores) {
            if (score >= 80) {
                console.log(score + "점: 합격입니다!");
            } else {
                console.log(score + "점: 불합격입니다!");
            }
        }
    </script>
</head>
<body>
</body>
</html>
