<!DOCTYPE html>
<html lang = 'ko'>
<head>
    <title>계산기</title>
</head>
    
<body>
    <canvas id = 'tan'></canvas>
    <button id = '계산기'></button>
    <button id = '더하기'></button>
    <button id = '빼기'></button>
    <button id = '곱하기'></button>
    <button id = '나누기'></button>
    <button id = '값'></button>
    
    <script>
        const tab = document.getElementById('tan');
        const ctx = tab.getContext('2d');
        
        tab.width = window.innerWidth;
        tab.height = window.innerHeight;

        const itX = 100;
        const itY = 100;
        const itWidth = 120;
        const itHeight = 50;

        ctx.fillStyle = 'Black';
        ctx.fillRect(itX , itY , itWidth , itHeight);

        ctx.fillStyle = 'white';
        ctx.font = '20px Arial';
        ctx.fillText('버튼' , itX + 40 , itY + 30);

        tab.onclick = function(event) {
            const x = event.offsetX;
            const y = event.offsetY;

            if (x >= itX && x <= itX + itWidth &&
                y >= itY && y <= itY + itHeight) {
                const a = prompt('동의 하십니까?(예/아니오)')
                    
                if (a === '예') {
                    const b = confirm('정말 동의하십니까?')
                        if (b === true) {
                            
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            
                            ctx.font = ('200px Arial');
                            ctx.fillStyle = 'skyblue';
                            ctx.fillText('동의하시는군요.' , tab.width / 2 , tab.height / 2);
                        }
                }
            }
        };
    </script>
</body>
</html>
